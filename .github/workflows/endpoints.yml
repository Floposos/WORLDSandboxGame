name: Endpoint check

# Prüft die externen Datenquellen (keine Tests, kein Key). Läuft wöchentlich,
# manuell und wenn sich das Prüfskript ändert.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - scripts/check-endpoints.sh
      - .github/workflows/endpoints.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-endpoints.sh
